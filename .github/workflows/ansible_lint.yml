name: Ansible linting example

on:
  workflow_dispatch:
    inputs:
      playbooks:
        description: 'Playbook location(s) to lint'
        required: true
        type: string
        default: 'playbooks/'

jobs:
  Ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Ansible Lint ${{ inputs.playbooks }}
        run: ansible-lint ${{ inputs.playbooks }}
