name: Ansible linting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      playbooks:
        description: 'Playbook location(s) to lint'
        required: true
        type: string
        default: 'playbooks/'

jobs:
  Ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install Ansible
        run: pip install ansible

      - name: Install Ansible Lint
        run: pip install ansible-lint

      - name: Ansible Lint
        run: |
          PLAYBOOKS="${{ github.event.inputs.playbooks || 'playbooks/ roles/ /includes' }}"
          echo "Linting playbooks at: $PLAYBOOKS"
          ansible-lint $PLAYBOOKS
